name: desktop_kit
version: 1.0.0

authors:
  - shpeckman

description: |
  Native application runtime for Crystal programs on Linux: GTK 4 and
  libadwaita windows, tabs, splits and surfaces driven by typed actions,
  with desktop notifications, global shortcuts, DBus IPC and systemd
  integration.

crystal: ">= 1.22.3"

libraries:
  libadwaita-1: ">= 1.7"
  gtk4: ">= 4.18"

license: MIT
