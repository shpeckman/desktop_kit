# .github/workflows/ci.yml
# Checks formatting, runs the specs and builds the docs and examples on
# Fedora, whose GTK and libadwaita meet the requirements. A pushed v* tag
# that passes becomes a GitHub release.
name: CI

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:
    branches: [dev, main]

env:
  CRYSTAL_VERSION: 1.22.3

jobs:
  test:
    runs-on: ubuntu-latest
    container: fedora:42
    steps:
      - name: Install packages
        run: >
          dnf install -y --setopt=install_weak_deps=False
          gcc make git tar gzip findutils
          pcre2-devel zlib-devel
          glib2-devel gtk4-devel libadwaita-devel gtk4-layer-shell-devel
          wayland-devel libepoxy-devel pango-devel
          sway grim dbus-daemon mesa-dri-drivers mesa-libEGL
          gsettings-desktop-schemas adwaita-sans-fonts google-noto-sans-fonts
      # sway's cap_sys_nice is outside the container's bounding set, so
      # exec fails with EPERM while the binary carries it.
      - name: Drop sway's file capabilities
        run: setcap -r /usr/bin/sway
      - name: Install Crystal
        run: |
          curl -fsSL "https://github.com/crystal-lang/crystal/releases/download/${CRYSTAL_VERSION}/crystal-${CRYSTAL_VERSION}-1-linux-x86_64.tar.gz" | tar xz -C /opt
          echo "/opt/crystal-${CRYSTAL_VERSION}-1/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
      - name: Format
        run: crystal tool format --check src spec tools examples
      # The runner has no GPU render node for DMA-BUF export.
      - name: Specs
        run: crystal spec --threads 2 --tag '~gpu'
      - name: Docs
        run: make docs
      - name: Examples
        run: make examples

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
