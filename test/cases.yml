# cases.yml
# The cases of the desktop_kit live tests; see README.md. Shots allow a color
# difference of 2: KDE antialiases the window's bottom corners slightly
# differently from sway.

# The global binding fires through the desktop's global shortcuts portal
# while the window has the focus. Global bindings have no window shortcut,
# so the tab can only come from the portal's Activated signal. The sleep
# lets the portal bind the shortcut first: desktop_kit has no hook for a
# successful bind.
global-shortcut:
  modes: [kde]
  global: true
  steps:
    - expect window
    - sleep 1500
    - key ctrl+alt+shift+F9
    - expect tab
    - close

# Key sequences on a real keyboard. ctrl+t is also a plain window shortcut:
# after ctrl+a the sequence must take it, so `capture` reports and `accel`
# does not. The shot shows the pending sequence in the key state overlay.
# `expect` skips lines until the expected one, so it can't check that a
# binding did not fire: `capture` itself is the proof.
sequences:
  modes: [kde, sway]
  steps:
    - expect window
    - key ctrl+t
    - expect accel tables=
    - key ctrl+a n
    - expect sequence tables=
    - key ctrl+a
    - settle
    - shoot pending tolerance=2
    - key ctrl+t
    - expect capture tables=
    - close

# The key table `mode` stays until Escape; the once variant leaves after
# its first binding. The shot shows the table in the key state overlay.
key-tables:
  modes: [kde, sway]
  steps:
    - expect window
    - key ctrl+a e
    - settle
    - shoot mode tolerance=2
    - key x
    - expect table tables=mode
    - key x
    - expect table tables=mode
    - key Escape
    - key ctrl+a n
    - expect sequence tables=
    - key ctrl+a o
    - key x
    - expect table tables=
    - key ctrl+a n
    - expect sequence tables=
    - close

# A surface's progress: the bar on the pane, the tab's loading indicator
# and, in kde mode, the taskbar entry of the installed desktop file (see
# README.md). The shot covers the window only.
progress:
  modes: [kde, sway]
  steps:
    - expect window
    - key ctrl+a p
    - expect progress 40
    - settle
    - shoot progress tolerance=2
    - key ctrl+a shift+p
    - expect progress -1
    - close

# Tabs in the header bar: two tabs, then the tab bar moves into the header
# bar. The shot shows the header bar's look with both tabs.
header-tabs:
  modes: [kde, sway]
  steps:
    - expect window
    - key ctrl+a t
    - expect tab
    - key ctrl+a h
    - expect header tabs
    - settle
    - shoot header tolerance=2
    - close

# Drag and drop with a real pointer: the window's surface is dragged by its
# drag handle onto the right edge of its split, which moves it there. The
# first moves stay on the handle: GTK starts the drag only once the
# pointer passes its threshold while still over the handle.
drag-drop:
  modes: [kde, sway]
  steps:
    - expect window
    - key ctrl+a s
    - key ctrl+a l
    - expect surfaces window,split
    - move 200 50
    - settle
    - down
    - move 205 50
    - move 210 50
    - move 215 50
    - move 220 50
    - sleep 200
    - move 400 200
    - move 700 300
    - move 780 300
    - sleep 300
    - up
    - settle
    - key ctrl+a l
    - expect surfaces split,window
    - close

# Dragging a surface by its pane header instead of the drag handle: pane
# headers on, the window's surface split, then the pointer drags the left
# header's title onto the right edge of the split. As with drag-drop, the
# first moves stay on the header (y 58, below the 44 px header bar). The
# shot shows both pane headers.
header-drag:
  modes: [kde, sway]
  steps:
    - expect window
    - key ctrl+a m
    - expect pane headers
    - key ctrl+a s
    - key ctrl+a l
    - expect surfaces window,split
    - settle
    - shoot headers tolerance=2
    - move 150 58
    - settle
    - down
    - move 155 58
    - move 160 58
    - move 165 58
    - move 170 58
    - sleep 200
    - move 400 200
    - move 700 300
    - move 780 300
    - sleep 300
    - up
    - settle
    - key ctrl+a l
    - expect surfaces split,window
    - close

# A canvas with offload on, in a tab of its own: its first frame must
# reach the screen as a DMA-BUF texture, the right way up (red top, blue
# bottom in the shot). KWin antialiases the bottom corners over saturated
# blue up to 4 off from sway, hence the higher tolerance.
offload:
  modes: [kde, sway]
  steps:
    - expect window
    - key ctrl+a c
    - expect canvas dmabuf=true
    - settle
    - shoot canvas tolerance=4
    - close

# The search bar: typing reports each search text, Enter and Shift+Enter
# move between the label's three matches, a drag on the match count snaps
# the bar to the nearest corner (bottom left here), Escape closes it.
search-overlay:
  modes: [kde, sway]
  steps:
    - expect window
    - key ctrl+a f
    - type abc
    - expect search abc
    - key Return
    - expect navigate next
    - key Return
    - expect navigate next
    - key shift+Return
    - expect navigate previous
    - settle
    - shoot search tolerance=2
    - move 660 77
    - down
    - move 650 90
    - move 600 150
    - move 400 300
    - move 200 450
    - move 150 500
    - sleep 200
    - up
    - settle
    - shoot snapped tolerance=2
    - key Escape
    - expect search end
    - close

# The quick panel: a top overlay panel that takes the focus when shown
# and hides when it loses it. The harness focuses the window before every
# key step, so the report after the panel opened sees it hidden; its
# binding shows it again.
panel-quick:
  modes: [kde, sway]
  steps:
    - expect window
    - key ctrl+a q
    - expect panel shown=true
    - sleep 500
    - key ctrl+a v
    - expect panel shown=false
    - key ctrl+a q
    - expect panel shown=true
    - close

# A bottom dock reserves its height: a left panel that keeps clear of
# reserved space gets exactly that much shorter.
panel-dock:
  modes: [kde, sway]
  steps:
    - expect window
    - key ctrl+a b
    - expect dock clear=true
    - close

# The header bar's main menu opens on a click and shows the default
# sections; its New Tab item opens a tab.
header-menu:
  modes: [kde, sway]
  steps:
    - expect window
    - move 677 21
    - click
    - settle
    - shoot menu tolerance=2
    - move 607 93
    - click
    - expect tab
    - close

# The same menu with Dutch texts from `DesktopKit.translator`.
translation:
  modes: [kde, sway]
  dutch: true
  steps:
    - expect window
    - move 677 21
    - click
    - settle
    - shoot menu tolerance=2
    - key Escape
    - close

# A right click on a label opens its context menu; its Report item
# reports through the window.
context-menu:
  modes: [kde, sway]
  steps:
    - expect window
    - move 400 300
    - click right
    - settle
    - shoot menu tolerance=2
    - move 430 315
    - click
    - expect context tables=
    - close

# Ctrl+A K opens the keyboard shortcuts dialog; typing searches it. The
# first Escape leaves the search, the second closes the dialog. One Escape
# per step with a settle between: two in one `key` step left the dialog
# open and `close` hung.
shortcuts-dialog:
  modes: [kde, sway]
  steps:
    - expect window
    - key ctrl+a k
    - settle
    - shoot dialog tolerance=2
    - type progress
    - settle
    - shoot search tolerance=2
    - key Escape
    - settle
    - key Escape
    - settle
    - shoot closed tolerance=2
    - close

# Ctrl+A I opens the about dialog.
about:
  modes: [kde, sway]
  steps:
    - expect window
    - key ctrl+a i
    - settle
    - shoot dialog tolerance=2
    - key Escape
    - close

# With a sequence timeout a quick Ctrl+A N still fires, but after a pause
# the pending Ctrl+A is gone and Ctrl+T reaches the plain window shortcut.
sequence-timeout:
  modes: [kde, sway]
  steps:
    - expect window
    - key ctrl+a w
    - expect timeout 300
    - key ctrl+a n
    - expect sequence tables=
    - key ctrl+a
    - sleep 800
    - key ctrl+t
    - expect accel tables=
    - close

# A canvas rendering on its own thread shows its first frame the right
# way up (red top, blue bottom). The live app uses GSK's Vulkan renderer,
# unlike the specs (ngl): this case caught a Vulkan-only crash.
threaded-canvas:
  modes: [kde, sway]
  steps:
    - expect window
    - key ctrl+a g
    - expect canvas threaded
    - settle
    - shoot canvas tolerance=4
    - close

# The tray icon registers with the desktop's StatusNotifierWatcher. Only
# kde: the nested sway shares the session bus, so it would show in the
# desktop's tray.
tray:
  modes: [kde]
  steps:
    - expect window
    - key ctrl+a y
    - expect tray registered=true
    - close
